name: Publicar versión web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - name: Compilar para GitHub Pages
        run: pnpm run build
        env:
          VITE_WEB_BASE: /auralis-caja-fantasma/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ./dist
      - name: Esperar a que GitHub reconozca el paquete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const { GITHUB_REPOSITORY, GITHUB_RUN_ID, GH_TOKEN, PAGES_ARTIFACT_NAME } = process.env;
          const url = `https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100`;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: "application/vnd.github+json" },
              cache: "no-store",
            });
            if (!response.ok) throw new Error(`GitHub artifact lookup failed (${response.status})`);
            const { artifacts } = await response.json();
            const matches = artifacts.filter((artifact) => artifact.name === PAGES_ARTIFACT_NAME && !artifact.expired);
            if (matches.length === 1) {
              await new Promise((resolve) => setTimeout(resolve, 1500));
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          throw new Error("GitHub has not indexed the Pages artifact yet");
          JS
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
