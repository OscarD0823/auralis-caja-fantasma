name: Compilar candidato Android

on:
  push:
    branches: [codex/signing-migration-1.25.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Preparar Android
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint && pnpm test
      - name: Inicializar proyecto Android
        run: pnpm tauri android init --ci --skip-targets-install
      - name: Compilar APK ARM64 sin firma privada
        run: pnpm tauri android build --ci --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
          CARGO_BUILD_JOBS: 4
      - uses: actions/upload-artifact@v5
        with:
          name: Caja-Fantasma-Android-1.25.0-sin-firma
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 7
