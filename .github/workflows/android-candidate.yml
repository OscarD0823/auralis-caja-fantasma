name: Compilar candidato Android

on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preparar Android
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint && pnpm test
      - id: version
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "app=" + require("./package.json").version + "\n")'
      - name: Inicializar proyecto Android
        run: pnpm tauri android init --ci --skip-targets-install
      - name: Compilar APK ARM64 sin firma privada
        run: pnpm tauri android build --ci --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
          CARGO_BUILD_JOBS: 4
      - name: Probar los relojes y avisos nativos
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-android-updater:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: Caja-Fantasma-Android-${{ steps.version.outputs.app }}-sin-firma
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 7
